[package]
name = "ferro-launcher"
version = "0.1.0"
description = "FERRO - An All-in-One System Organizer & High-Speed Launcher"
authors = ["FERRO Engineering"]
edition = "2021"

[lib]
name = "ferro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"
notify = "6.1"
sysinfo = "0.32"
image = "0.25"
ico = "0.3"
dirs = "5.0"
open = "5.3"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true